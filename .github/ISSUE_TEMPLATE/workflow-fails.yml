name: A workflow fails
description: A `cao run` did not do what the YAML says it should
title: "[workflow] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Most failures are environment or YAML, and both are visible in the two outputs below.
        `cao diagnostics <run-id> --out bug.json` gathers everything about one run into a single
        redacted file; attaching it usually answers every question here at once.
        `cao` makes no network calls of its own, so nothing here is sent anywhere but this issue —
        please still redact anything private in prompts, paths or agent output.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected the run to do, and what it did instead.
      placeholder: |
        `review` should have started after `implement` merged, but the run exited 1 with ...
    validations:
      required: true

  - type: textarea
    id: validate
    attributes:
      label: "`cao validate <workflow>.yaml --json` output"
      description: >-
        The complete output. It carries the normalised workflow, the diagnostics and the execution
        plan, which is usually enough on its own.
      render: json
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: "`cao diagnostics <run-id> --out bug.json`"
      description: >-
        Attach `bug.json`, or paste it here. `cao list` prints the run ids. The bundle carries that
        run's doctor facts, the redacted workflow, the run events, `live.json`, the orchestrator log
        and every attempt record with the tail of its `stderr.log` — everything below, in one file.
        Transcripts, prompts and diffs are left out unless you add `--include transcripts,prompts,diffs`.
        If you cannot run it, `cao doctor --json` plus the run's `workflow.json` and `report.md`
        (under `.orchestrator/runs/<run-id>/`) is the next best thing.
      render: json
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "`cao --version`"
      placeholder: 2.0.0-beta.1
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS, Node and agent CLI versions
      description: "`node --version`, `git --version`, and `claude --version` and/or `codex --version`."
      placeholder: Windows 11, node v22.12.0, git 2.47.1, claude 2.1.278, codex 0.154.0
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: The workflow YAML
      description: The smallest version of it that still fails, if you can get there.
      render: yaml
    validations:
      required: false
