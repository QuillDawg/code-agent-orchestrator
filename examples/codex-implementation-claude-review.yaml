# Codex implements, Claude reviews, Codex remediates.
# The reverse of mixed-agents.yaml: a different vendor reviewing the work catches more than a second
# pass by the one that wrote it. `remediate` runs only if the review recorded warnings.
version: 1
name: Codex implementation with Claude review
repository: .

execution:
  mode: dag
  maxConcurrency: 1

claude:
  configMode: isolated

# Note: on transport "exec" no human can be reached during the task - the Codex CLI answers approval
# and question requests itself, with a rejection. `cao validate` now warns about that, and a task that
# does need a decision ends as needs_input quoting what Codex asked instead of failing after its
# retries. Nothing here has to change; use transport "appServer" with approvals: host if a Codex task
# of your own must be able to ask.
codex:
  transport: exec
  approvals: auto
  configMode: isolated

tasks:
  - id: implement
    agent: codex
    type: implementation
    prompt: Implement the requested change and run the focused tests.

  - id: cross-review
    agent: claude
    type: review
    dependsOn: [implement]
    context:
      from: [implement]
      include: [summary, decisions, warnings, git]
    prompt: Review the implementation in the current worktree and its Git diff. Report concrete correctness, security, and test gaps as warnings.

  - id: remediate
    agent: codex
    type: implementation
    dependsOn: [cross-review]
    when:
      expr: tasks.cross-review.warnings.length > 0
    context:
      from: [cross-review]
    prompt: Address the Claude review findings, run the relevant tests, and leave unrelated code unchanged.
