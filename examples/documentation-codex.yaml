# Documentation smoke test - Codex.
# The same bounded edit as documentation-claude.yaml, through the Codex CLI instead:
#   cao run examples/documentation-codex.yaml --no-tui
#   git diff -- examples/documentation-smoke-target.md
version: 1
name: Documentation smoke test - Codex
repository: .

agent: codex
model: gpt-5.6-luna
effort: low

execution:
  maxConcurrency: 1

# Note: on transport "exec" no human can be reached during the task - the Codex CLI answers approval
# and question requests itself, with a rejection. `cao validate` now warns about that, and a task that
# does need a decision ends as needs_input quoting what Codex asked instead of failing after its
# retries. Nothing here has to change; use transport "appServer" with approvals: host if a Codex task
# of your own must be able to ask.
codex:
  transport: exec
  approvals: auto
  configMode: isolated
  permissionMode: auto

tasks:
  - id: improve-validation-docs
    type: documentation
    timeout: 10m
    prompt: |
      Review examples/documentation-smoke-target.md for a first-time cao user.
      Make exactly one small improvement: add a "Validate before running" section
      containing `cao validate workflow.yaml` and `cao run workflow.yaml --dry-run`,
      with one concise sentence explaining each command.

      Touch only examples/documentation-smoke-target.md. Preserve its existing style,
      inspect the final diff, and report the changed file in the structured result.
